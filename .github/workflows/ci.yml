name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # apps/web (SvelteKit) resolves these via $env/static/public at build time —
      # Vite fails the build if they're undefined, even though nothing here
      # actually calls Supabase during a typecheck/build/test run. Placeholder
      # values, not secrets: real credentials are supplied by the hosting
      # platform (Vercel/VPS) at deploy time, not by CI.
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
